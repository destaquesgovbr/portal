type Subscription {
  """
  Gera recortes em tempo real via agente LLM. Passthrough do SSE do worker clipping. Requer autenticacao.
  """
  generateRecortes(prompt: String!): AgentEvent!
}

enum SubscriptionRole {
  AUTHOR
  SUBSCRIBER
}

type Tag {
  label: String!
  count: Int!
}

type Theme {
  code: String!
  label: String!
}

type ThemeCount {
  code: String!
  label: String
  count: Int!
}

"""
Theme statistics with article count
"""
type ThemeStats {
  label: String!
  count: Int!
}

type PolicyListItem {
  entityId: String!
  canonicalName: String!
  domain: String
  lifecyclePhase: String
  wikidataId: String
  aliases: [String!]!
  articleCount: Int!
}

type TrendingEntityResult {
  entityId: String!
  canonicalName: String!
  type: String!
  trendingScore: Float!
  volumeRatio: Float!
  windowCount: Int!
  windowAgencies: Int!
  computedAt: String
}

type TrendingThemeResult {
  themeLabel: String!
  themeCode: String
  windowCount: Int!
  baselineDailyAvg: Float!
  growthScore: Float!
  topArticles: [ArticleSummary!]!
}

type TypesenseDocRecordType {
  uniqueId: String!
  title: String!
  url: String!
  imageUrl: String
  videoUrl: String
  content: String
  summary: String
  subtitle: String
  editorialLead: String
  category: String
  tags: [String!]!
  agencyKey: String
  agencyName: String
  publishedAt: DateTime
  extractedAt: DateTime
  themeL1Code: String
  themeL1Label: String
  themeL2Code: String
  themeL2Label: String
  themeL3Code: String
  themeL3Label: String
  mostSpecificThemeCode: String
  mostSpecificThemeLabel: String
  features: JSON
  contentEmbedding: [Float!]
  sentimentLabel: String
  sentimentScore: Float
  trendingScore: Float
  wordCount: Int
  hasImage: Boolean
  hasVideo: Boolean
  imageBroken: Boolean
  readabilityFlesch: Float
}

type UserSubscription {
  id: String!
  clippingId: String!
  userId: String!
  role: SubscriptionRole!
  deliveryChannels: DeliveryChannels!
  extraEmails: [String!]!
  webhookUrl: String
  active: Boolean!
  subscribedAt: DateTime
}

type WidgetArticlesResult {
  articles: [Article!]!
  pagination: WidgetPagination!
}

type WidgetConfig {
  agencies: [String!]!
  themes: [String!]!
}

input WidgetConfigInput {
  agencies: [String!]! = []
  themes: [String!]! = []
  layout: WidgetLayout! = LIST
  articlesPerPage: Int! = 10
}

enum WidgetLayout {
  LIST
  GRID_2
  GRID_3
  CAROUSEL
}

type WidgetPagination {
  page: Int!
  limit: Int!
  total: Int!
  hasMore: Boolean!
}
